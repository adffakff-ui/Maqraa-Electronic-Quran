name: Build Android APK & GitHub Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build Debug APK
        run: |
          if command -v gradle &> /dev/null; then
            gradle :app:assembleDebug --stacktrace
          elif [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew :app:assembleDebug --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            ## 📱 إصدار تطبيق بوابة الجمعية وإدارة حلقات تحفيظ القرآن الكريم
            - تطبيق أندرويد متكامل بتقنية Jetpack Compose و Material Design 3.
            - دعم إدارة الحلقات، المعلمين، والطلاب، وتسجيل الحضور بالـ QR.
            - بوابة ولي الأمر مع إمكانية رفع التسجيلات الصوتية واختبارات التلاوة بالقراءات العشر.
            - دعم كامل لكافة الجمعيات اليمنية الرائدة في جميع المحافظات (جمعية هائل سعيد أنعم، جمعية معاذ العلمية، خيرية القرآن).
            - نموذج تسجيل المشرف الجديد مع التحقق الكامل.
