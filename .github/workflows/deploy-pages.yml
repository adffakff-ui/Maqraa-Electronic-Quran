name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare pages artifact
        run: |
          mkdir -p out
          cp -r index.html README.md out/ || true
          if [ -d "assets" ]; then cp -r assets out/ || true; fi
          if [ -d "supervisor" ]; then cp -r supervisor out/ || true; fi
          if [ -d "circle" ]; then cp -r circle out/ || true; fi
          if [ -d "teacher" ]; then cp -r teacher out/ || true; fi
          if [ -d "parent" ]; then cp -r parent out/ || true; fi
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then cp app/build/outputs/apk/debug/app-debug.apk out/ || true; fi

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'out'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
